# Build, sign (Developer ID, hardened runtime), notarize, and staple a macOS .app, then upload it as an artifact.
# macOS runners only: codesign, notarytool, and stapler have no Linux equivalent (and cost more per minute,
# so run only when the app's inputs change).
#
# Secrets: MACOS_CERTIFICATE_P12 (base64 of the .p12), MACOS_CERTIFICATE_PASSWORD, MACOS_KEYCHAIN_PASSWORD (random),
#          APPLE_API_KEY_P8 (contents of AuthKey_{id}.p8), APPLE_API_KEY_ID, APPLE_API_ISSUER_ID
# Variables: MACOS_SIGNING_IDENTITY ("Developer ID Application: {Name} ({TEAM_ID})"), so a renewed certificate
#            does not need a code change
name: Sign and notarize

on:
  push:
    branches: [main]
    paths:
      - "{app-sources}/**"
      - "{build-script}"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP: "dist/{App Name}.app"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Import the certificate into a temporary keychain
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$P12" | base64 --decode > "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          # Add to the search list without dropping the existing keychains
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: bash {build-script}   # must produce $APP

      - name: Sign
        env:
          IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Hardened runtime and a secure timestamp are both required for notarization
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarize and staple
        env:
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          zip="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$APP" "$zip"   # ditto keeps the bundle's symlinks and metadata; plain zip can break the signature
          if ! xcrun notarytool submit "$zip" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER" --wait --output-format json > "$RUNNER_TEMP/result.json"; then
            cat "$RUNNER_TEMP/result.json"; exit 1
          fi
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/result.json" 2>/dev/null || python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/result.json")
          if [ "$status" != "Accepted" ]; then
            id=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/result.json")
            xcrun notarytool log "$id" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER"   # explains every rejected file
            exit 1
          fi
          xcrun stapler staple "$APP"   # lets Gatekeeper accept the app offline
          rm -f "$key" "$zip"

      - name: Verify as Gatekeeper would
        run: |
          set -euo pipefail
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Package
        run: ditto -c -k --keepParent "$APP" "dist/{app-name}-mac.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/{app-name}-mac.zip
