# Dependabot pull requests that change a package.json in a pnpm workspace sometimes leave the root lockfile stale.
# This regenerates it on those pull requests only. Pushes made with GITHUB_TOKEN do not re-run CI;
# use a separate token (or re-run CI manually) if CI must run on the lockfile commit.
name: Update pnpm lockfile

on:
  pull_request:
    paths:
      - "**/package.json"

permissions:
  contents: write

jobs:
  update:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Commit the lockfile if it changed
        run: |
          git diff --quiet -- pnpm-lock.yaml && { echo "Lockfile up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock.yaml"
          git push
