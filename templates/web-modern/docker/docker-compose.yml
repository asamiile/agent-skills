# Local-only stack: every port bound to 127.0.0.1, every container non-root, data in named volumes.
services:
  backend:
    build: ./backend
    env_file: [./backend/.env]          # secrets live here; .env is gitignored, .env.example is committed
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
    ports:
      - "127.0.0.1:8000:8000"           # loopback only: other machines on the network cannot reach it
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 5

  frontend:
    build: { context: ./frontend, target: dev }
    env_file: [./frontend/.env.local]
    environment:
      - BACKEND_API_URL=http://backend:8000   # server-side calls use the compose network, not localhost
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules   # keeps the container's modules from being hidden by the bind mount
    depends_on:
      backend: { condition: service_healthy }

  # A read-only data browser: :ro on the mount, plus the tool's own read-only flag
  db-browser:
    build: ./db-browser
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - backend_data:/data:ro

  # Optional local model server. The host port is shifted so it does not clash with a native install
  model-server:
    build: ./model-server
    ports:
      - "127.0.0.1:{host-port}:{container-port}"
    volumes:
      - model_cache:/app/data/.cache/models   # the non-root user's home (see Dockerfile.nonroot-wrapper)
    # Linux with an NVIDIA GPU and nvidia-container-toolkit; Docker Desktop on Apple Silicon has no GPU passthrough
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

volumes:
  backend_data:
  frontend_node_modules:
  model_cache:
